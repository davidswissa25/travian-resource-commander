<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travian Resource Commander</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171e26; --panel2:#1d2630; --line:#2a3744;
    --txt:#e6edf3; --dim:#8b9aa8; --faint:#5d6b78;
    --crop:#f5b342; --lumber:#5fa55a; --clay:#c8703a; --iron:#9aa7b4;
    --ok:#3fb950; --warn:#f0a92b; --bad:#f0533f; --accent:#f5b342;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;flex-wrap:wrap;gap:10px;row-gap:8px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  header h1 span{color:var(--crop)}
  .grow{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:7px 13px;border-radius:7px;transition:.12s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);color:#1a1207;border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent}
  button.sm{padding:4px 9px;font-size:12px}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.4;cursor:not-allowed}
  select{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:5px 9px;border-radius:7px}
  select:hover{border-color:var(--accent)}
  .pgroup{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
  .pgroup select{border-color:transparent;background:transparent;font-weight:600;max-width:200px}
  .pgroup button{border-color:transparent;background:transparent;padding:5px 8px}
  .pgroup .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 1px}
  main{padding:18px 20px;max-width:1280px;margin:0 auto}
  .cmd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .stat .val{font-size:22px;font-weight:700;margin-top:4px}
  .stat .sub{font-size:12px;color:var(--faint);margin-top:2px}
  .val.good{color:var(--ok)} .val.bad{color:var(--bad)} .val.warn{color:var(--warn)} .val.crop{color:var(--crop)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;color:var(--dim)}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tabs button:hover{color:#fff}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .vcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
  .vcard.crit{border-color:var(--bad)} .vcard.over{border-color:var(--warn)}
  .vhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .vhead .name{font-weight:650;font-size:15px}
  .vhead .coord{font-size:12px;color:var(--faint)}
  .vhead .tribe{font-size:11px;color:var(--dim);background:var(--panel2);padding:2px 7px;border-radius:5px}
  .clock{font-size:13px;padding:8px 10px;border-radius:7px;margin:8px 0;font-weight:600}
  .clock.bad{background:rgba(240,83,63,.12);color:var(--bad)}
  .clock.over{background:rgba(240,169,43,.12);color:var(--warn)}
  .clock.ok{background:rgba(63,185,80,.10);color:var(--ok)}
  .bars{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .bar{display:grid;grid-template-columns:46px 1fr 92px;align-items:center;gap:8px;font-size:12px}
  .bar .track{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar .fill{height:100%;border-radius:5px}
  .bar .num{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .f-lumber{background:var(--lumber)} .f-clay{background:var(--clay)} .f-iron{background:var(--iron)} .f-crop{background:var(--crop)}
  .vmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .vactions{display:flex;gap:6px;margin-top:10px}
  .netcrop{font-weight:700}
  .synced{font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 4px;margin-left:6px}
  .troop-badge{font-size:10px;color:var(--iron);border:1px solid var(--iron);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--panel2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.ok{background:rgba(63,185,80,.15);color:var(--ok)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;padding:22px}
  .modal h2{margin:0 0 16px;font-size:17px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--dim)}
  input,select,textarea{font:inherit;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 9px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .sect{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-top:6px;border-top:1px solid var(--line);padding-top:10px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .troop-row{display:grid;grid-template-columns:1fr 80px 80px 30px;gap:6px;align-items:center}
  .empty{text-align:center;color:var(--faint);padding:50px 20px}
  .empty h3{color:var(--dim)}
  .opt-controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .opt-controls label{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
  .note{font-size:12px;color:var(--faint);margin:6px 0 14px}
  .imp{color:var(--ok);font-weight:600}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Travian <span>Resource Commander</span></h1>
  <div class="pgroup" title="Profile (account)">
    <select id="profileSelect" title="Active profile (account)" onchange="setActiveProfile(this.value)"></select>
    <span class="sep"></span>
    <button class="sm" onclick="newProfile()" title="New empty profile">&#43;</button>
    <button class="sm" onclick="renameProfile()" title="Rename current profile">&#9998;</button>
    <button class="sm danger" onclick="deleteProfile()" title="Delete current profile">&#128465;</button>
    <span class="sep"></span>
    <button class="sm" onclick="exportActiveProfile()" title="Export this profile to a file to share">&#10515; Share</button>
  </div>
  <div class="grow"></div>
  <button class="ghost sm" onclick="exportJSON()">Export</button>
  <button class="ghost sm" onclick="document.getElementById('importFile').click()">Import / Sync</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  <button class="ghost sm" onclick="pullFromGame()" title="Copy the retrieval script to run in your game's console">Pull from game &#9863;</button>
  <button class="ghost sm" onclick="openPaste()">Paste from game</button>
  <button class="primary" onclick="openVillage()">+ Village</button>
</header>

<!-- Retrieval script (mirror of retrieve-data.js). "Pull from game" copies this to run in the game console. -->
<script type="text/plain" id="gamePullScript">
(async function () {
  'use strict';
  const ALLIANCE_BONUS = 90;
  const SERVER = (+(location.host.match(/\bx(\d+)\b/) || [])[1]) || 1;
  const TRIBE = {
    gaul:     { name: 'Gauls',     base: 750,  toRate: 20 },
    roman:    { name: 'Romans',    base: 500,  toRate: 40 },
    teuton:   { name: 'Teutons',   base: 1000, toRate: 20 },
    egyptian: { name: 'Egyptians', base: 750,  toRate: 20 },
    hun:      { name: 'Huns',      base: 500,  toRate: 20 },
    spartan:  { name: 'Spartans',  base: 500,  toRate: 20 }
  };
  const TID = { 1: 'roman', 2: 'teuton', 3: 'gaul', 6: 'egyptian', 7: 'hun', 8: 'spartan' }; // Travian tribeId -> wall class
  const STRIP = /[‪-‮⁦-⁩]/g;
  const clean = s => String(s == null ? '' : s).replace(STRIP, '').replace(/\s+/g, ' ').trim();
  const getText = u => fetch(u, { credentials: 'same-origin' }).then(r => r.text());
  const title = h => { const dc = new DOMParser().parseFromString(h, 'text/html'); return clean((dc.querySelector('.titleInHeader, h1') || {}).textContent); };
  const lvl = (h, label) => { const t = title(h); if (label && !new RegExp(label, 'i').test(t)) return 0; const m = t.match(/Level\s*(\d+)/i); return m ? +m[1] : 0; };
  const log = (...a) => console.log('%c[retrieve]', 'color:#f5b342', ...a);
  function readShipCap(did){return new Promise(res=>{const ifr=document.createElement('iframe');ifr.style.cssText='position:fixed;width:0;height:0;border:0;left:-9999px';let done=false;const fin=v=>{if(done)return;done=true;try{ifr.remove();}catch(e){}res(v);};ifr.onload=async()=>{for(let k=0;k<50;k++){try{const m=clean(ifr.contentDocument.body.innerText).match(/Capacity per trade ship:?\s*([\d,]+)/i);if(m)return fin(parseInt(m[1].replace(/[^\d]/g,''),10)||0);}catch(e){}await new Promise(r=>setTimeout(r,200));}fin(0);};ifr.src='/build.php?gid=17&t=5&newdid='+did;document.body.appendChild(ifr);setTimeout(()=>fin(0),15000);});}
  log('reading village list...');
  const root = await getText('/dorf1.php');
  const i = root.indexOf('"villageList":');
  if (i < 0) { alert('Could not read the village list - make sure you are logged into the game world.'); return; }
  let d = 0, s = root.indexOf('[', i), j = s;
  for (; j < root.length; j++) { const c = root[j]; if (c === '[') d++; else if (c === ']') { d--; if (!d) { j++; break; } } }
  const list = [];
  JSON.parse(root.slice(s, j)).forEach(e => e.villages ? e.villages.forEach(v => list.push(v)) : list.push(e));
  log('found ' + list.length + ' villages');
  const villages = [];
  for (const v of list) {
    const d1 = await getText('/dorf1.php?newdid=' + v.id);
    const pm = d1.match(/production:\s*(\{[^}]*\})/); const p = pm ? JSON.parse(pm[1]) : {};
    const mkt = lvl(await getText('/build.php?gid=17&newdid=' + v.id));
    const to  = lvl(await getText('/build.php?gid=28&newdid=' + v.id), 'Trade Office');
    const bar = lvl(await getText('/build.php?gid=19&newdid=' + v.id));
    const sta = lvl(await getText('/build.php?gid=20&newdid=' + v.id));
    const twn = lvl(await getText('/build.php?gid=24&newdid=' + v.id)); // Town Hall
    const d2 = await getText('/dorf2.php?newdid=' + v.id);
    const tid = +(d1.match(/"village":\s*\{[^}]*?"tribeId":\s*(\d+)/) || [])[1] || 0; // reliable even without a wall
    const wm = d2.match(/class="wall\s+([a-z]+)/i);
    const T = TRIBE[TID[tid] || (wm ? wm[1].toLowerCase() : 'roman')] || TRIBE.roman;
    const cap = Math.round(T.base * SERVER * (1 + T.toRate * to / 100) * (1 + ALLIANCE_BONUS / 100));
    const harbor = clean(await getText('/build.php?gid=49&newdid=' + v.id));
    const sm = harbor.match(/trade ?ship[^()]*\(\s*in service\s*(\d+)/i);
    const ships = sm ? +sm[1] : 0;
    const shipCap = ships > 0 ? await readShipCap(v.id) : 0;
    const l4 = p.l4 || 0, l5 = p.l5 || 0;
    villages.push({
      name: v.name, did: v.id, x: v.x, y: v.y, tribe: T.name, synced: true,
      prod: { lumber: p.l1 || 0, clay: p.l2 || 0, iron: p.l3 || 0, crop: l5 },
      baseConsumption: Math.max(0, l5 - l4),
      marketplaceLevel: mkt, tradeOfficeLevel: to, merchantCapacityReal: cap,
      tradeShips: ships, shipCapacityReal: shipCap,
      barracksLevel: bar, stableLevel: sta, townHallLevel: twn
    });
    log(v.name + ': ' + T.name + ' mkt' + mkt + ' TO' + to + ' bar' + bar + ' sta' + sta + ' th' + twn + ' cap' + cap + ' net' + l4);
  }
  if (list[0]) await getText('/dorf1.php?newdid=' + list[0].id);
  villages.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' }));
  const payload = { source: 'travian-sync', note: 'retrieve-data ' + new Date().toISOString() + '; capacity computed (alliance ' + ALLIANCE_BONUS + '%, server x' + SERVER + ')', villages };
  const json = JSON.stringify(payload, null, 2);
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'travian-carrier-data.json';
    document.body.appendChild(a); a.click(); a.remove();
    log('%cDONE - downloaded travian-carrier-data.json (' + villages.length + ' villages). Import it into the tool.', 'color:#3fb950');
  } catch (e) { console.log(json); }
  window.travianCarrierData = payload;
  try { await navigator.clipboard.writeText(json); log('(also copied to clipboard)'); } catch (e) {}
})();
</script>

<script>
const RES = ["lumber","clay","iron","crop"];
const TRIBES = {
  Romans:{merchantCapacity:500,merchantSpeed:16}, Gauls:{merchantCapacity:750,merchantSpeed:24},
  Teutons:{merchantCapacity:1000,merchantSpeed:12}, Egyptians:{merchantCapacity:750,merchantSpeed:16},
  Huns:{merchantCapacity:500,merchantSpeed:20}, Spartans:{merchantCapacity:400,merchantSpeed:16},
};
// Trade ship game constant (same for every harbor, like a tribe's merchant stats).
// capacity = base resources per ship, speed = fields/hour. Server speed & alliance
// commerce bonus are applied on top in effShipCap/effShipSpeed.
const SHIP = {capacity:500, speed:18};  // capacity is a per-village fallback (real value retrieved); speed base 18
// Troop training database. cost = {lumber,clay,iron} per troop; baseTime = seconds at server speed x1, building level 1.
// Training time at level L and speed S: baseTime / S * 0.99^(L-1). Troops/h = 3600 / training_time.
const TROOPS = {
  Romans:{
    barracks:[
      {name:"Legionnaire",          cost:{lumber:120,clay:60,iron:40},  baseTime:1600},
      {name:"Praetorian",           cost:{lumber:100,clay:130,iron:55}, baseTime:2133},

  },

      {name:"Haeduan",              cost:{lumber:360,clay:330,iron:280},baseTime:5333},
    ]
  },

      {name:"Spearman",             cost:{lumber:145,clay:70,iron:85},  baseTime:2133},

    ],

    ]
  },
  Egyptians:{
    barracks:[
      {name:"Slave Militia",        cost:{lumber:45,clay:60,iron:30},   baseTime:900},
      {name:"Ash Warden",           cost:{lumber:115,clay:145,iron:60}, baseTime:2133},

    ],

      {name:"Anhur Guard",          cost:{lumber:240,clay:355,iron:230},baseTime:3200},

    ]
  },
  Huns:{

    ],

  },
  Spartans:{ // official Travian Legends "Glory of Sparta" units (cost excl. crop; baseTime = seconds at building L1, x1)
    barracks:[
      {name:"Hoplite",             cost:{lumber:110,clay:185,iron:110},baseTime:1700},

    ],
    stable:[

      {name:"Corinthian Crusher",  cost:{lumber:660,clay:495,iron:995},baseTime:3432},
    ]
  }
};
// Celebrations (Town Hall). Costs are fixed; duration shrinks with Town Hall level and server speed.
// Official Travian: small = 24h, great = 60h at level 1 on x1, x0.964 per extra level; unlock: small L1, great L10.
// duration(h) = base * 0.964^(level-1) / (floor(speed/3)+1). To run 24/7 you pay one cost per duration.
const CELEB = {
  small: { cost:{lumber:6400, clay:6650, iron:5940, crop:500},   baseHours:24 },
  great: { cost:{lumber:29700,clay:33250,iron:32000,crop:6700},  baseHours:60 }
};
// Duration in hours of the celebration a village would run (great if Town Hall >=10, else small).
function celebrationDurationH(level, speed){
  if(!level||level<1) return 0;
  const c = level>=10 ? CELEB.great : CELEB.small;
  return c.baseHours * Math.pow(0.964, level-1) / (Math.floor((speed||1)/3)+1);

// A village's identity is its coordinates, not its name. Renaming in-game used to create

function dedupeAndSort(s){
  const byCoord={}, drop={};

    const k=(v.x||0)+'|'+(v.y||0), ex=byCoord[k];
    if(!ex){ byCoord[k]=v; return; }

    if((!keep.troops||!keep.troops.length) && lose.troops&&lose.troops.length) keep.troops=lose.troops;

    s.routes=(s.routes||[]).filter(r=>r.from!==r.to);

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function consumption(v){ return (v.baseConsumption||0)+troopUpkeep(v)+celebrationNeedsPerHour(v).crop+troopNeedsPerHour(v).crop; }

/* ---- optimizer ---- */
// Build ONE unified plan: run crop balance (+ troop supply + overflow in all-in-one mode),
// merge every proposed shipment sharing the same From->To into a single trade route carrying all
// four resources, then guard against overfilling any granary/warehouse over time.
const OVERFILL_HORIZON = 48; // h: allow filling a warehouse no faster than this
function buildAutoPlan(mode){
  const cropPlan=optimize();
  const all = mode==='all';
  const troopPlan = all ? optimizeTroopSupply(cropPlan) : {routes:[]};
  const overflowPlan = all ? optimizeOverflow(cropPlan, troopPlan) : {routes:[]};
  const merged={};
  const addRoute=(r,tag)=>{
    const iv=snapInterval(r.interval||r.intervalHours||1);
    const key=r.from+">"+r.to;
    const m=merged[key]||(merged[key]={from:r.from,to:r.to,fromName:r.fromName,toName:r.toName,
      flow:{lumber:0,clay:0,iron:0,crop:0},interval:iv,merchants:0,ships:0,distance:r.distance||0,tags:new Set(),relay:null});
    if(r.resources) RES.forEach(k=>m.flow[k]+=(r.resources[k]||0)/iv);
    if(r.cropPerHour!=null) m.flow.crop+=r.cropPerHour;
    m.merchants+=r.merchants||0; m.ships+=r.ships||0;
    m.interval=Math.min(m.interval,iv);
    if(r.distance) m.distance=r.distance;
    if(r.relay) m.relay=r.relay;
    m.tags.add(tag);
  };
  cropPlan.routes.forEach(r=>addRoute(r,"crop"));
  troopPlan.routes.forEach(r=>addRoute(r,"troops"));
  overflowPlan.routes.forEach(r=>addRoute(r,"overflow"));
  let routes=Object.values(merged);
  // ---- overfill guard: cap each receiver's added inflow so its store can't exceed capacity over time ----
  const f0=planFlows(); // existing routes (empty in From-scratch mode)
  state.villages.forEach(v=>{
    RES.forEach(k=>{
      const inn=routes.filter(r=>r.to===v.id && r.flow[k]>0);
      const totalIn=inn.reduce((s,r)=>s+r.flow[k],0); if(totalIn<=0) return;
      const cap=(k==='crop'?(v.granary&&v.granary.capacity):(v.warehouse&&v.warehouse.capacity))||0;
      const cur=(k==='crop'?(v.granary&&v.granary.crop):(v.warehouse&&v.warehouse[k]))||0;
      let base=prodBase(v,k); if(k==='crop') base-=consumption(v); // own rate before this plan
      if(k!=='crop' && v.troopVillage) base-=troopNeedsPerHour(v)[k]||0; // troop training consumes l/c/i, freeing room for inflow
      base += ((f0.inn[v.id]&&f0.inn[v.id][k])||0) - ((f0.out[v.id]&&f0.out[v.id][k])||0);
      routes.forEach(r=>{ if(r.from===v.id) base-=r.flow[k]; }); // subtract this plan's own outflow (relay hubs forward what they receive)
      // crop: never push net above 0 (keep granary from filling); l/c/i: allow filling no faster than the horizon
      const allowed = k==='crop' ? Math.max(0,-base) : (cap>0 ? Math.max(0, (cap-cur)/OVERFILL_HORIZON - base) : totalIn);
      if(totalIn>allowed+0.5){ const scale=allowed/totalIn; inn.forEach(r=>r.flow[k]*=scale); }
    });
  });
  routes.forEach(r=>{ r.resources={}; RES.forEach(k=>r.resources[k]=Math.round(r.flow[k]*r.interval)); r.tags=[...r.tags]; });
  // Min route /h: drop any (merged) route whose total hourly flow is below the threshold.
  routes=routes.filter(r=>{ const flowH=RES.reduce((s,k)=>s+(r.flow[k]||0),0); return flowH>=Math.max(1,optMinRoute) && RES.some(k=>r.resources[k]>=1); });
  const bySrc={}; routes.forEach(r=>(bySrc[r.from]=bySrc[r.from]||[]).push(r));
  Object.values(bySrc).forEach(list=>list.forEach((r,i)=>r.offsetHours=+((r.interval*i/Math.max(1,list.length)).toFixed(3))));
  // summary
  const moved={lumber:0,clay:0,iron:0,crop:0}; routes.forEach(r=>RES.forEach(k=>moved[k]+=r.flow[k]));
  const parts=[]; if(moved.crop>=1) parts.push(fmt(moved.crop)+" crop"); ["lumber","clay","iron"].forEach(k=>{ if(moved[k]>=1) parts.push(fmt(moved[k])+" "+k); });
  const summary = routes.length
    ? `${routes.length} trade route${routes.length>1?'s':''} across ${Object.keys(bySrc).length} village(s), moving ${parts.join(" + ")||"—"} per hour.`
    : (cropPlan.balanced && all ? "Everything is balanced — no crop deficit, no troop/celebration shortfall, no overflow." : cropPlan.summary);
  let unmetNote = cropPlan.unmet && cropPlan.unmet.length
    ? `<p class="note">&#9888; Crop still uncovered: ${cropPlan.unmet.map(u=>esc(u.name)+" ("+fmt(u.need)+"/h short)").join(", ")}.</p>` : "";
  if(overflowPlan.urgent && overflowPlan.urgent.length)
    unmetNote += `<p class="note">&#9888; Warehouse still filling within ${WAREHOUSE_FILL_H}h (out of carriers or troop-village room): ${overflowPlan.urgent.join(", ")}. Raise Marketplace levels/trade ships or add another troop village.</p>`;
  return {routes, summary, unmetNote, cropPlan};
}
function renderUnified(plan){
  const vName=id=>{const v=state.villages.find(x=>x.id===id);return v?v.name:'?';};
  const bySrc={}; plan.routes.forEach(r=>(bySrc[r.from]=bySrc[r.from]||[]).push(r));
  const cell=(val,col)=>`<td class="num" style="color:var(--${col})">${val>=1?fmt(val):'<span style="color:var(--faint)">&mdash;</span>'}</td>`;
  // per-village incoming per resource (used by the troop-village summary below)
  const io={}, ioOf=id=>io[id]||(io[id]={in:{lumber:0,clay:0,iron:0,crop:0},out:{lumber:0,clay:0,iron:0,crop:0}});
  plan.routes.forEach(r=>RES.forEach(k=>{ const f=r.flow[k]||0; if(f>0){ ioOf(r.from).out[k]+=f; ioOf(r.to).in[k]+=f; } }));
  // Summary of what this plan actually delivers to troop-making villages (incoming /h vs 24/7 training need)
  const troopVils=state.villages.filter(v=>v.troopVillage).sort((a,b)=>(a.troopPriority||1)-(b.troopPriority||1));
  let troopTable='';
  if(troopVils.length){
    const tot={lumber:0,clay:0,iron:0,crop:0};
    const rows=troopVils.map(v=>{
      const inn=(io[v.id]&&io[v.id].in)||{lumber:0,clay:0,iron:0,crop:0}, need=troopNeedsPerHour(v);
      const avail=k=>prodBase(v,k)+(inn[k]||0); // own production + incoming routes
      RES.forEach(k=>tot[k]+=avail(k));
      const lci=['lumber','clay','iron'].map(k=>{ const got=avail(k), req=need[k]||0;
        const col=req<1?'ok':(got>=req-0.5?'ok':(got>0?'warn':'bad'));
        return `<td class="num" style="color:var(--${col})">${fmt(got)}${req>=1?' <span style="color:var(--faint)">/ '+fmt(req)+'</span>':''}</td>`; }).join('');
      // warehouse fill assuming you are NOT training (production + incoming just piles up)
      const cap=(v.warehouse&&v.warehouse.capacity)||0; let fill=Infinity;
      ['lumber','clay','iron'].forEach(k=>{ const cur=(v.warehouse&&v.warehouse[k])||0, netk=avail(k);
        if(netk>0.5 && cap>0){ const e=(cap-cur)/netk; if(e<fill) fill=e; } });
      const fillCell = fill===Infinity ? '<span style="color:var(--faint)">&mdash;</span>'
        : `<span style="color:var(--${fill<WAREHOUSE_FILL_H?'bad':fill<24?'warn':'ok'})">${hms(fill)}</span>`;
      return `<tr><td><input type="number" min="1" value="${v.troopPriority||1}" title="Supply priority — 1 is supplied first. Edit to reorder." style="width:42px" onchange="setTroopPriority('${v.id}',this.value)"> ${esc(v.name)}</td>${lci}<td class="num" style="color:var(--crop)">${fmt(avail('crop'))}</td><td class="num">${fillCell}</td></tr>`;
    }).join('');
    troopTable=`<div style="margin-bottom:16px"><b>&#9876; Supply at troop villages /h</b> <span class="note" style="margin:0">&mdash; own production + incoming <span style="color:var(--faint)">/ 24&#8260;7 training need</span>; warehouse fill = soonest of L/C/I if <b>not</b> training; edit <b>#</b> to reorder supply priority</span>
      <table style="margin-top:6px"><thead><tr><th>Troop village</th><th class="num">Lumber</th><th class="num">Clay</th><th class="num">Iron</th><th class="num">Crop</th><th class="num">Warehouse fills</th></tr></thead><tbody>
      ${rows}<tr style="font-weight:650"><td>Total</td><td class="num" style="color:var(--lumber)">${fmt(tot.lumber)}</td><td class="num" style="color:var(--clay)">${fmt(tot.clay)}</td><td class="num" style="color:var(--iron)">${fmt(tot.iron)}</td><td class="num" style="color:var(--crop)">${fmt(tot.crop)}</td><td></td></tr></tbody></table></div>`;
  }
  let html=troopTable+`<table><thead><tr><th>To</th><th class="num">Lumber</th><th class="num">Clay</th><th class="num">Iron</th><th class="num">Crop</th><th class="num">Every</th><th class="num">Carriers</th><th>Purpose</th><th></th></tr></thead><tbody>`;
  Object.keys(bySrc).sort((a,b)=>String(vName(a)).localeCompare(String(vName(b)),undefined,{numeric:true})).forEach(src=>{
    const list=bySrc[src];
    const out=(io[src]&&io[src].out)||{lumber:0,clay:0,iron:0,crop:0};
    const outStr=RES.filter(k=>out[k]>=1).map(k=>`<span style="color:var(--${k})">${fmt(out[k])}</span>`).join(' <span style="color:var(--faint)">&middot;</span> ');
    html+=`<tr><td colspan="9" style="background:var(--panel2);font-weight:650">&#128666; ${esc(vName(src))} &mdash; ${list.length} route${list.length>1?'s':''} <span style="font-weight:400;font-size:11px;color:var(--dim);margin-left:8px">out /h: ${outStr||'&mdash;'}</span></td></tr>`;
    list.forEach(r=>{
      const carriers=`${r.merchants}&#128722;`+(r.ships?` + ${r.ships}&#9973;`:'');
      const fromV=state.villages.find(v=>v.id===r.from), toV=state.villages.find(v=>v.id===r.to);
      const rl=routeLink(fromV);
      html+=`<tr>
        <td>&rarr; ${esc(r.toName||vName(r.to))}${r.relay?' <span class="troop-badge">hub</span>':''}</td>
        ${cell(r.resources.lumber,'lumber')}${cell(r.resources.clay,'clay')}${cell(r.resources.iron,'iron')}${cell(r.resources.crop,'crop')}
        <td class="num">${r.interval}h${r.offsetHours?(' @'+hhmm(r.offsetHours)):''}</td>
        <td class="num" title="merchants + trade ships">${carriers}</td>
        <td style="font-size:11px;color:var(--dim)">${r.tags.join(' + ')}</td>
        <td style="white-space:nowrap">${rl?'<a href="'+rl+'" target="_blank" style="color:var(--accent)" title="Open this village&rsquo;s Trade routes tab to create the recurring route">+Route&#8599;</a>':''}</td>
      </tr>`;
    });
  });
  html+=`</tbody></table>
    <p class="note">Each row is one trade route carrying all four resources at once. Interval = round-trip so carriers recycle; inflows are capped so no granary/warehouse overfills within ${OVERFILL_HORIZON}h. Carriers combine the crop, troop and overflow needs (upper bound when merged).</p>`;
  return html;
}
function applyAutoPlan(){
  const plan=buildAutoPlan(optMode);
  // From-scratch plans are complete, so replace the optimizer's previous output (auto routes)
  // instead of stacking on top. Manual and in-game-synced routes are left untouched.
  if(optFromScratch) state.routes=state.routes.filter(r=>!r.auto);
  plan.routes.forEach(r=>state.routes.push({id:uid(),from:r.from,to:r.to,
    resources:{lumber:r.resources.lumber||0,clay:r.resources.clay||0,iron:r.resources.iron||0,crop:r.resources.crop||0},
    intervalHours:r.interval,merchants:r.merchants,ships:r.ships||0,offsetHours:r.offsetHours||0,auto:true}));
  save(); setTab("routes");
  if(!plan.routes.length) alert("Nothing to apply — no routes were proposed.");
}

function sendLink(fromV,toV,crop){
  if(!state.serverUrl||!fromV||!fromV.did||!toV) return "";
  return state.serverUrl.replace(/\/+$/,"")+"/build.php?newdid="+fromV.did+"&gid=17&t=5&x="+(toV.x||0)+"&y="+(toV.y||0)+"&r1=0&r2=0&r3=0&r4="+Math.max(0,Math.round(crop));
}
function optimize(){
  const flows=planFlows();
  const data=state.villages.map(v=>{ const p=projected(v,flows); return {v,net:p.net.crop,crop:p.cur.crop,capRoom:p.cap.crop-p.cur.crop}; });
  const committed=planCommitted();
  // Shared per-village carrier pool (merchants + trade ships free after existing routes). A village
  // can be both a crop donor AND a relay hub for another village's crop, so every leg - direct or
  // forwarded - draws from this one pool, which prevents booking the same carrier twice.
  const carr={}; state.villages.forEach(v=>{ const c=committed[v.id]||{merchants:0,ships:0};
    carr[v.id]={merch:Math.max(0,maxMerchants(v)-c.merchants), ship:Math.max(0,maxShips(v)-c.ships)}; });
  const wrap=id=>({v:state.villages.find(x=>x.id===id), merchAvail:carr[id].merch, shipAvail:carr[id].ship});
  let donors=data.map(d=>({v:d.v, avail:d.net-keepReserve(d.v).crop})).filter(d=>d.avail>0); // reserve = build buffer only in still-building villages
  let receivers=data.filter(d=>d.net<0).map(d=>({...d,need:-d.net,eta:d.crop/(-d.net)})).sort((a,b)=>a.eta-b.eta);
  const hubs=data.filter(d=>d.net>=0).map(d=>({v:d.v})); // any non-draining village may forward crop on (1 hop)
  const balanced=receivers.length===0, routes=[], unmet=[];
  const hadDonors=donors.length>0, freeCarriers=donors.reduce((s,d)=>s+carr[d.v.id].merch+carr[d.v.id].ship,0);
  // Batch model: send "perSend" crop every "interval" h. Interval is as long as possible
  // (=round trip, so carriers recycle) but short enough to arrive before the granary empties.
  // If the village drains faster than carriers return, waves overlap => more carriers needed.
  // Travian trade routes only accept intervals of 1,2,3,4,6,8,12,24h. Pick the largest allowed
  // interval that (a) is near the round trip for carrier efficiency, (b) arrives before the
  // granary empties, and (c) doesn't overflow the destination granary in one batch.
  function chooseInterval(T,eta,freeSpace,F){
    let I=Math.max(1,T);
    if(eta>0) I=Math.min(I, eta);
    if(F>0 && freeSpace>0) I=Math.min(I, freeSpace/F);
    return snapIntervalFloor(Math.max(1, Math.min(24, I||1)));
  }
  // Fill a flow target from a donor's fleets (richest carrier first), respecting whole-hour
  // intervals and per-fleet availability. Returns delivered crop/h plus carriers tied up.
  function allocate(d,dst,rec,target){
    const fleets=donorFleets(d,dst);
    const Tfast=fleets.reduce((m,f)=>Math.min(m,f.T), Infinity);
    const I=chooseInterval(Tfast, rec.crop/Math.max(1,rec.need), rec.capRoom, target);
    let remaining=target, F=0, mUsed=0, sUsed=0, capped=false;
    for(const f of fleets){
      if(remaining<=0.5 || f.avail<=0) continue;
      const want=Math.min(remaining, f.avail*f.per), waves=Math.ceil(f.T/I);
      let cPerSend=Math.max(1,Math.ceil((want*I)/f.cap)), conc=cPerSend*waves;
      if(conc>f.avail){ capped=true; cPerSend=Math.floor(f.avail/waves); conc=cPerSend*waves; }

  // ---- candidate supply paths: direct donor->receiver, or relayed donor->hub->receiver (1 hop) ----
  // Relaying lets a far donor hand crop to a nearby hub that finishes the trip with ITS own spare
  // carriers (e.g. a coastal village's idle trade ships) - covering deficits a direct route can't,
  // and sparing the donor's fleet for other villages.
  function directCand(D,R,need){
    const dst=dist(D.v,R.v), a=allocate(wrap(D.v.id),dst,R,Math.min(need,D.avail));

    return {F:a.F,dCarr:a.mUsed+a.sUsed,totCarr:a.mUsed+a.sUsed,maxDist:dst,kind:"direct",srcId:D.v.id,

    const d1=dist(D.v,H.v), p=allocate(wrap(D.v.id),d1,sink,Math.min(need,D.avail));
    if(p.F<optMinRoute) return null;                              // first leg can't move a worthwhile amount
    const d2=dist(H.v,R.v), a2=allocate(wrap(H.v.id),d2,R,Math.min(p.F,need));
    if(a2.F<1) return null;                                       // hub has no spare carriers for the onward leg
    const a1=allocate(wrap(D.v.id),d1,sink,a2.F), F=Math.min(a1.F,a2.F); // size leg 1 to the binding flow
    if(F<1) return null;
    return {F,dCarr:a1.mUsed+a1.sUsed,totCarr:a1.mUsed+a1.sUsed+a2.mUsed+a2.sUsed,maxDist:Math.max(d1,d2),
      kind:"relay",srcId:D.v.id,hubId:H.v.id,
      legs:[{fromId:D.v.id,toV:H.v,a:a1,dst:d1,relay:"in"},{fromId:H.v.id,toV:R.v,a:a2,dst:d2,relay:"out"}]};
  }
  function better(c,b){ // most crop delivered, then spare the donor's own fleet, then fewer carriers/legs, then nearer
    if(Math.abs(c.F-b.F)>0.5) return c.F>b.F;
    if(c.dCarr!==b.dCarr) return c.dCarr<b.dCarr;
    if(c.totCarr!==b.totCarr) return c.totCarr<b.totCarr;
    if((c.kind==="direct")!==(b.kind==="direct")) return c.kind==="direct";
    return c.maxDist<b.maxDist;
  }
  function commitCand(c,covered){
    c.legs.forEach(leg=>{
      const fromV=state.villages.find(x=>x.id===leg.fromId), a=leg.a, perSend=Math.round(c.F*a.I);
      carr[leg.fromId].merch=Math.max(0,carr[leg.fromId].merch-a.mUsed);
      carr[leg.fromId].ship =Math.max(0,carr[leg.fromId].ship -a.sUsed);
      const impact = c.kind==="relay"
        ? (leg.relay==="in" ? "relay &rarr; "+esc(leg.toV.name)+" (hub)" : "hub &rarr; "+esc(leg.toV.name)+(covered?" &middot; covered":""))
        : (covered?"deficit fully covered":"&minus;"+fmt(c.F)+"/h drain");
      routes.push({from:leg.fromId,to:leg.toV.id,fromName:fromV.name,toName:leg.toV.name,
        cropPerHour:c.F,perSend,interval:a.I,distance:Math.round(leg.dst),
        merchants:a.mUsed,ships:a.sUsed,roundTrip:a.roundTrip,merchCapped:a.capped,
        relay:c.kind==="relay"?leg.relay:null,impact});
    });
  }
  receivers.forEach(R=>{
    let need=R.need;
    while(need>1){
      let best=null;
      const consider=c=>{ if(c && (c.F>=optMinRoute || c.F>=need-1) && (!best||better(c,best))) best=c; };
      donors.forEach(D=>{ if(D.avail<=0.5) return;
        consider(directCand(D,R,need));
        hubs.forEach(H=>{ if(H.v.id!==D.v.id && H.v.id!==R.v.id && carr[H.v.id].merch+carr[H.v.id].ship>0) consider(relayCand(D,H,R,need)); });
      });
      if(!best || best.F<1) break;                 // nothing can make progress
      const covered=(need-best.F)<=1;
      commitCand(best,covered);
      const D=donors.find(d=>d.v.id===best.srcId); if(D) D.avail-=best.F;
      need-=best.F;
    }

  });
  // Stagger send offsets per source so carriers aren't all out at once.
  const bySrc={}; routes.forEach(r=>{ (bySrc[r.from]=bySrc[r.from]||[]).push(r); });
  Object.keys(bySrc).forEach(k=>{ const list=bySrc[k], n=list.length; list.forEach((r,i)=>{ r.offsetHours=+(((r.interval||1)*i)/Math.max(1,n)).toFixed(3); }); });
  const spareCrop=donors.reduce((s,d)=>s+Math.max(0,d.avail),0);
  const spareCarriers=donors.reduce((s,d)=>s+carr[d.v.id].merch+carr[d.v.id].ship,0);
  const merchantBlocked = !balanced && !routes.length && hadDonors && freeCarriers<=0;
  let summary;

  else if(routes.length){ const delivered=routes.filter(r=>r.relay!=="in").reduce((s,r)=>s+r.cropPerHour,0);
    const relays=routes.filter(r=>r.relay==="in").length;
    summary=`${routes.length} route${routes.length>1?'s':''} proposed: moving ${fmt(delivered)} crop/h to ${receivers.length-unmet.length} draining village(s)${relays?` (incl. ${relays} relayed via a hub)`:""}.`; }
  else if(merchantBlocked) summary="Donors have spare crop but no free carriers. Set Marketplace levels / trade ships (or the Default market lvl) - routes aren't suggested with 0 available carriers.";

function applyPlan(){
  const plan=optimize();
  plan.routes.forEach(r=>state.routes.push({id:uid(),from:r.from,to:r.to,
    resources:{lumber:0,clay:0,iron:0,crop:r.perSend},
    intervalHours:r.interval,merchants:r.merchants,ships:r.ships||0,offsetHours:r.offsetHours||0,auto:true}));
  save(); setTab("routes");
}
// All-in-one: crop balance + troop supply + overflow, computed in the order they share the
// carrier pool (each later plan sees the earlier plans' carrier reservations), applied at once.
function applyAll(){
  const cropPlan=optimize();
  const troopPlan=optimizeTroopSupply(cropPlan);
  const overflowPlan=optimizeOverflow(cropPlan,troopPlan);
  const add=(r,res)=>state.routes.push({id:uid(),from:r.from,to:r.to,resources:res,
    intervalHours:r.interval,merchants:r.merchants,ships:r.ships||0,offsetHours:r.offsetHours||0,auto:true});
  cropPlan.routes.forEach(r=>add(r,{lumber:0,clay:0,iron:0,crop:r.perSend}));
  troopPlan.routes.forEach(r=>add(r,r.resources));
  overflowPlan.routes.forEach(r=>add(r,r.resources));
  const n=cropPlan.routes.length+troopPlan.routes.length+overflowPlan.routes.length;
  save(); setTab("routes");
  if(!n) alert("Nothing to apply — no crop, troop-supply or overflow routes were proposed.");
}

// Propose routes to keep barracks + stable in troop villages running 24/7.
// Villages are served in priority order (troopPriority 1 = first). cropPlan routes
// are accounted for so the two plans don't double-book the same carrier fleet.
function optimizeTroopSupply(cropPlan){
  const troopVils=state.villages.filter(v=>v.troopVillage)
    .sort((a,b)=>(a.troopPriority||1)-(b.troopPriority||1));
  if(!troopVils.length) return {routes:[],summary:"",noTroops:true};
  const flows=planFlows(), committed=planCommitted();
  const cropExtra={};
  ((cropPlan&&cropPlan.routes)||[]).forEach(r=>{
    const e=cropExtra[r.from]||(cropExtra[r.from]={merchants:0,ships:0});
    e.merchants+=r.merchants||0; e.ships+=r.ships||0;
  });
  const nonCrop=["lumber","clay","iron"], routes=[];
  const donors=state.villages.filter(v=>!v.troopVillage).map(v=>{
    const net=netRates(v,flows), cel=keepReserve(v);
    const c=committed[v.id]||{merchants:0,ships:0}, ce=cropExtra[v.id]||{merchants:0,ships:0};
    // reserve the donor's own 24/7 celebration need + build buffer before it donates lumber/clay/iron
    const avail={}; nonCrop.forEach(k=>avail[k]=Math.max(0,net[k]-(cel[k]||0)));
    return {v,avail,
      merchAvail:Math.max(0,maxMerchants(v)-c.merchants-ce.merchants),
      shipAvail:Math.max(0,maxShips(v)-c.ships-ce.ships)};
  }).filter(d=>nonCrop.some(k=>d.avail[k]>0)&&d.merchAvail+d.shipAvail>0);
  // Per-village needs: what 24/7 production requires minus what already flows in via routes
  const needs={};
  troopVils.forEach(rec=>{
    const req=troopNeedsPerHour(rec);
    const inn=flows.inn[rec.id]||{};
    // only the shortfall: 24/7 training need minus the village's OWN production and what already flows in
    nonCrop.forEach(k=>{ req[k]=Math.max(0,req[k]-prodBase(rec,k)-(inn[k]||0)); });
    needs[rec.id]=req;
  });
  // Serve troop villages in priority order; donors are shared across villages
  for(const rec of troopVils){
    const need=needs[rec.id];
    const totalNeed=nonCrop.reduce((s,k)=>s+(need[k]||0),0);
    if(totalNeed<1) continue; // fully covered already
    const cands=donors
      .filter(d=>d.merchAvail+d.shipAvail>0&&nonCrop.some(k=>d.avail[k]>0))
      .map(d=>({d,dst:dist(d.v,rec)})).sort((a,b)=>a.dst-b.dst);
    for(const {d,dst} of cands){
      if(nonCrop.every(k=>(need[k]||0)<1)) break;
      const Tm=(2*dst)/effSpeed(d.v);
      const I=snapInterval(Math.max(1,Math.min(24,Tm||1)));
      const waves=Math.ceil(Tm/I), cap=effCap(d.v);
      // Send only what is still needed (not already covered) and what donor has
      const rawSend={}; let totalRaw=0;
      nonCrop.forEach(k=>{
        rawSend[k]=Math.round(Math.min(d.avail[k],need[k]||0)*I);
        totalRaw+=rawSend[k];
      });
      if(totalRaw<1) continue;
      const totalCarrs=Math.max(1,Math.ceil(totalRaw/cap))*waves;
      const sends={...rawSend}; let merch=totalCarrs;
      if(totalCarrs>d.merchAvail){
        const avWaves=Math.floor(d.merchAvail/waves); if(avWaves<1) continue;
        const scale=(avWaves*cap)/totalRaw;
        nonCrop.forEach(k=>sends[k]=Math.round(rawSend[k]*scale)); merch=avWaves*waves;
      }
      const totalFinal=nonCrop.reduce((s,k)=>s+(sends[k]||0),0);
      if(totalFinal<1||merch<1) continue;
      const ph={};
      nonCrop.forEach(k=>ph[k]=(sends[k]||0)/I);
      // Coverage tag
      const coveredNow=nonCrop.every(k=>ph[k]>=(need[k]||0)-0.5);
      routes.push({from:d.v.id,to:rec.id,fromName:d.v.name,toName:rec.name,
        priority:rec.troopPriority||1,
        resources:{lumber:sends.lumber||0,clay:sends.clay||0,iron:sends.iron||0,crop:0},
        interval:I,distance:Math.round(dst),merchants:merch,ships:0,perHour:ph,
        impact:coveredNow?"need met":"partial"});
      nonCrop.forEach(k=>{
        d.avail[k]=Math.max(0,d.avail[k]-(sends[k]||0)/I);
        need[k]=Math.max(0,(need[k]||0)-(sends[k]||0)/I);
      });
      d.merchAvail-=merch;
    }
  }
  // Stagger offsets per source
  const bySrc={};
  routes.forEach(r=>(bySrc[r.from]=bySrc[r.from]||[]).push(r));
  Object.values(bySrc).forEach(list=>list.forEach((r,i)=>{r.offsetHours=+((r.interval*i/Math.max(1,list.length)).toFixed(3));}));
  // Summary per troop village
  const uncovered=troopVils.filter(v=>{
    const n=needs[v.id]; return nonCrop.some(k=>(n&&n[k]||0)>1);
  });
  const hasConfig=troopVils.some(v=>v.barracksLevel||v.stableLevel);
  let summary;
  if(!hasConfig) summary="Mark barracks/stable levels and select a troop type in each village's Edit form.";
  else if(routes.length) summary=`${routes.length} route${routes.length>1?'s':''} proposed to supply ${[...new Set(routes.map(r=>r.to))].length} troop village${troopVils.length>1?'s':''} (priority order).${uncovered.length?' '+uncovered.length+' village(s) partially uncovered — insufficient donor surplus or free carriers.':''}`;
  else summary="Troop villages configured but no donor has surplus lumber/clay/iron with free carriers to send.";
  return {routes,summary,needs,troopVils,uncovered,hasConfig};
}

/* ---- overflow balancer: lumber / clay / iron ---- */
// Active only in "Crop + balance overflow" mode. A village whose warehouse is filling
// toward capacity ships the excess to the emptiest villages (lowest fill ratio) so the
// production isn't wasted. Runs AFTER the crop + troop-supply plans and subtracts their
// carriers, so the same merchant is never booked twice. Troop villages are excluded as
// receivers here - they're fed precisely by optimizeTroopSupply instead.
const OVERFLOW_HORIZON = 48; // h: only relieve villages that will overflow this soon
const WAREHOUSE_FILL_H = 8;  // h: a warehouse filling sooner than this is urgent - relieve it first
function optimizeOverflow(cropPlan, troopPlan){
  const nonCrop=["lumber","clay","iron"];
  const flows=planFlows(), committed=planCommitted();
  const reserved={};
  [cropPlan,troopPlan].forEach(pl=>((pl&&pl.routes)||[]).forEach(r=>{
    const e=reserved[r.from]||(reserved[r.from]={merchants:0,ships:0});
    e.merchants+=r.merchants||0; e.ships+=r.ships||0;
  }));
  const proj={}; state.villages.forEach(v=>proj[v.id]=projected(v,flows));
  const carr={};
  state.villages.forEach(v=>{
    const c=committed[v.id]||{merchants:0,ships:0}, rs=reserved[v.id]||{merchants:0,ships:0};
    carr[v.id]=Math.max(0,maxMerchants(v)-c.merchants-rs.merchants);
  });
  // l/c/i per hour each donor already sends via the troop-supply plan, so we don't double-spend surplus.
  const usedByTroop={};
  ((troopPlan&&troopPlan.routes)||[]).forEach(r=>{ const e=usedByTroop[r.from]||(usedByTroop[r.from]={lumber:0,clay:0,iron:0}); nonCrop.forEach(k=>e[k]+=(r.resources[k]||0)/(r.interval||1)); });
  const troopVils=state.villages.filter(v=>v.troopVillage).sort((a,b)=>(a.troopPriority||1)-(b.troopPriority||1));
  const routes=[]; let anyDonor=false; const anyRecv=troopVils.length>0; const urgent=new Set();
  nonCrop.forEach(k=>{
    // Donors: any NON-troop village with production surplus above its own reserve (celebration + build
    // buffer) and beyond what it already sends to cover troop needs. All of it is forwarded to troops.
    // Sorted by how soon its warehouse fills, so the ones filling within WAREHOUSE_FILL_H are relieved
    // first with the limited carriers (cascading to the next troop village as each fills).
    const donors=state.villages.filter(v=>!v.troopVillage).map(v=>{
      const p=proj[v.id], net=p.net[k], cap=p.cap[k]||0, cur=p.cur[k];
      const res=keepReserve(v)[k]||0, ut=(usedByTroop[v.id]&&usedByTroop[v.id][k])||0;
      const eta = net>0.5 && cap>0 ? (cap-cur)/net : Infinity;
      return {v, give:Math.max(0, net-res-ut), eta};
    }).filter(d=>d.give>0.5).sort((a,b)=>a.eta-b.eta);
    // Receivers: troop villages (priority order). Cap the overflow RATE so its warehouse can't fill
    // in under 8h (while training, the extra inflow beyond the training need is what accumulates).
    const receivers=troopVils.map(v=>{ const p=proj[v.id], cap=p.cap[k]||0, cur=p.cur[k];
      return {v, rate:Math.max(0,(cap-cur)/WAREHOUSE_FILL_H)};
    }).filter(r=>r.rate>0.5);
    if(donors.length) anyDonor=true;
    donors.forEach(d=>{
      let give=d.give;
      for(const r of receivers){
        if(give<optMinRoute || carr[d.v.id]<=0) break;
        if(r.v.id===d.v.id || r.rate<optMinRoute) continue;
        const dst=dist(d.v,r.v), Tm=(2*dst)/effSpeed(d.v);
        const I=snapInterval(Math.max(1,Math.min(24,Tm||1))), waves=Math.ceil(Tm/I), cap=effCap(d.v);
        const flow=Math.min(give, r.rate);
        if(flow<optMinRoute) continue;
        let perSend=Math.round(flow*I);
        let carriers=Math.max(1,Math.ceil(perSend/cap))*waves;
        if(carriers>carr[d.v.id]){ const w=Math.floor(carr[d.v.id]/waves); if(w<1) continue; perSend=Math.floor(w*cap); carriers=w*waves; }
        if(perSend<optMinRoute) continue;
        const ph=perSend/I;
        routes.push({from:d.v.id,to:r.v.id,fromName:d.v.name,toName:r.v.name,res:k,
          perSend,interval:I,distance:Math.round(dst),merchants:carriers,perHour:ph,
          resources:{lumber:k==='lumber'?perSend:0,clay:k==='clay'?perSend:0,iron:k==='iron'?perSend:0,crop:0},
          impact:'to troops'});
        give-=ph; carr[d.v.id]-=carriers; r.rate-=ph;
      }
      // still filling within the 8h target after routing all we could (carriers/room limited)
      if(d.eta<WAREHOUSE_FILL_H && give>optMinRoute) urgent.add(esc(d.v.name));
    });
  });
  // Stagger send offsets per source so carriers aren't all out at once.
  const bySrc={}; routes.forEach(r=>(bySrc[r.from]=bySrc[r.from]||[]).push(r));
  Object.values(bySrc).forEach(list=>list.forEach((r,i)=>r.offsetHours=+((r.interval*i/Math.max(1,list.length)).toFixed(3))));
  let summary;
  if(!routes.length){
    summary = !anyRecv  ? "No troop-making villages to forward surplus to. Mark a village with the &#9876; button."
            : !anyDonor ? "No village has spare lumber/clay/iron to forward after its own reserve."
            : `Surplus exists but is too far/small per donor to form a route above Min route /h (${fmt(optMinRoute)}). Lower it to use it.`;
  } else {
    summary = `${routes.length} route${routes.length>1?'s':''} forwarding surplus lumber/clay/iron to your troop-making villages.`;
  }
  if(urgent.size) summary += ` &#9888; Still filling within ${WAREHOUSE_FILL_H}h (out of carriers or troop-village room): ${[...urgent].join(", ")}.`;
  return {routes,summary,urgent:[...urgent]};
}

/* ---- balance analysis: per-village deficit / overflow, factoring active routes ---- */
// Uses the same projection the dashboard does (production - consumption + route in/out)
// but reports every resource and classifies each as draining (will empty) or
// overflowing (will hit capacity and waste). ETAs assume the current net rate holds.
function balanceRow(v,flows){
  const inn=flows.inn[v.id]||{}, out=flows.out[v.id]||{};
  const p=projected(v,flows), cells=RES.map(k=>{
    let base=prodBase(v,k); if(k==="crop") base-=consumption(v);
    const rawNet=base+(inn[k]||0)-(out[k]||0); // net BEFORE the outgoing cap - tells if sending is what flattens it
    const net=p.net[k], cur=p.cur[k], cap=p.cap[k]||0; let tag, col="ok", eta=Infinity;
    if(net<-0.5){ eta=cur/(-net); col=eta<6?"bad":"warn"; tag="empty in "+hms(eta); }
    else if(net>0.5){
      if(cap>0 && cur>=cap){ col="bad"; tag="overflowing"; }
      else if(cap>0){ eta=(cap-cur)/net; if(eta<24){ col="warn"; tag="full in "+hms(eta);} else tag="filling"; }
      else tag="filling";
    }
    // net ~ 0: distinguish a natural balance from sending being capped at what's available
    else tag = rawNet < -0.5 ? "sending surplus" : "balanced";
    return {k,net,col,tag,eta};
  });
  const worst=cells.reduce((a,b)=>(b.col==="bad"?2:b.col==="warn"?1:0)>(a.col==="bad"?2:a.col==="warn"?1:0)?b:a,cells[0]);
  return {v,cells,worst};
}
function renderBalance(){
  if(state.villages.length<1) return "";
  const flows=routeFlows();
  const rows=state.villages.map(v=>balanceRow(v,flows));
  const deficits=rows.filter(r=>r.cells.some(c=>c.net<-0.5)).length;
  const overflows=rows.filter(r=>r.cells.some(c=>c.tag.indexOf("full")===0||c.tag==="overflowing")).length;
  const per=balancePer===24?24:1, unit=per===24?"/24h":"/h"; // ETAs are unaffected; only the rate label scales
  const body=rows.sort((a,b)=>Math.min(...a.cells.map(c=>c.eta))-Math.min(...b.cells.map(c=>c.eta))).map(r=>{
    const tds=r.cells.map(c=>`<td class="num" style="color:var(--${c.col})">${signed(c.net*per)}<div class="sub" style="font-size:11px;opacity:.85">${c.tag}</div></td>`).join("");
    const badge=r.v.troopVillage?'<span class="troop-badge">&#9876;</span>':'';
    return `<tr><td>${esc(r.v.name)} ${badge}</td>${tds}</tr>`;
  }).join("");
  const btn=(p,lbl)=>`<button class="sm${per===p?' primary':''}" onclick="setBalancePer(${p})">${lbl}</button>`;
  return `<div style="margin-bottom:16px">
    <div style="display:flex;gap:18px;align-items:baseline;margin-bottom:8px">
      <b>Balance analysis</b>
      <span class="note" style="margin:0">${deficits} village(s) draining &middot; ${overflows} nearing overflow &mdash; with active routes applied</span>
      <span style="margin-left:auto;display:inline-flex;gap:4px;align-items:center"><span class="note" style="margin:0">Show rate:</span>${btn(1,"per 1h")}${btn(24,"per 24h")}</span>
    </div>
    <table><thead><tr><th>Village</th><th class="num">Lumber ${unit}</th><th class="num">Clay ${unit}</th><th class="num">Iron ${unit}</th><th class="num">Crop ${unit}</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

// Dropdown of the units actually trainable in this village (captured from its Barracks/Stable
// pages on Pull & Sync), with the real per-hour output at the current building level.
function troopOptionsHTML(trainable, building, selected){
  const list=(trainable||[]).filter(u=>u.building===building);
  return `<option value="">&#8212; none / skip &#8212;</option>`+
    list.map(u=>`<option value="${esc(u.name)}"${u.name===selected?' selected':''}>${esc(u.name)} (${fmt(3600/u.seconds)}/h)</option>`).join('');

// Resources/h to keep the chosen barracks + stable units training 24/7. Uses the real per-server
// unit cost and the training time captured at the village's current building level (rate=3600/s).
// Trainer artifact: unique/small trains in HALF the time in its village; the great version is
// 3/4 time across all villages. Stronger (smaller) multiplier wins. Less time -> more troops/h
// -> proportionally more resources needed.
function trainerFactor(v){ return Math.min((v&&v.trainerArtifact)?0.5:1, state.greatTrainer?0.75:1); }
function troopNeedsPerHour(v){
  const needs={lumber:0,clay:0,iron:0,crop:0}, list=v.trainable||[], f=trainerFactor(v);
  const add=name=>{ if(!name) return; const u=list.find(x=>x.name===name); if(!u||!u.seconds) return;
    const rate=3600/(u.seconds*f); RES.forEach(k=>needs[k]+=rate*((u.cost&&u.cost[k])||0)); };
  add(v.barracksTroop); add(v.stableTroop); add(v.workshopTroop);
  return needs;
}

    prod:{lumber:num("f_pl"),clay:num("f_pc"),iron:num("f_pi"),crop:num("f_pcr")},
    baseConsumption:num("f_base"), troops:optTroopRows.filter(t=>t.type||t.count),
    warehouse:{capacity:num("f_wcap"),lumber:num("f_wl"),clay:num("f_wc"),iron:num("f_wi")},
    granary:{capacity:num("f_gcap"),crop:num("f_gcur")},
    merchantCapacity:num("f_mcap"),merchantSpeed:num("f_mspd"),tradeOfficeLevel:num("f_to"),marketplaceLevel:num("f_mkt"),
    tradeShips:num("f_ships"),
    troopVillage:!!document.getElementById("f_troop").checked,
    troopPriority:num("f_priority")||1,
    barracksLevel:+(document.getElementById("f_bar_lvl").value)||0,
    barracksTroop:document.getElementById("f_bar_troop").value||null,
    stableLevel:+(document.getElementById("f_sta_lvl").value)||0,
    stableTroop:document.getElementById("f_sta_troop").value||null,
    workshopLevel:+(document.getElementById("f_wsp_lvl").value)||0,
    workshopTroop:document.getElementById("f_wsp_troop").value||null,
    townHallLevel:+(document.getElementById("f_th").value)||0,

    trainable:editingV?editingV.trainable:[],
    synced:editingV?editingV.synced:false, did:editingV?editingV.did:0, updatedAt:Date.now() };
  if(editingV){ const i=state.villages.findIndex(x=>x.id===v.id); state.villages[i]=v; }
  else state.villages.push(v);
  save(); closeVillage(); renderAll();
}
function delVillage(id){
  if(!confirm("Delete this village and its routes?")) return;
  state.villages=state.villages.filter(v=>v.id!==id);
  state.routes=state.routes.filter(r=>r.from!==id&&r.to!==id);

function toggleTroopVillage(id){

function toggleStillBuilding(id){

function saveRoute(){

  const r={ id:(editingR&&editingR.id)||uid(), from:g("r_from").value, to:g("r_to").value,

/* ---- import / export / sync-merge ---- */
function exportProfile(p){
  const payload={ source:"travian-commander-profile", label:p.label, accountKey:p.accountKey,
    villages:p.villages, routes:p.routes, serverSpeed:p.serverSpeed, allianceBonus:p.allianceBonus, defaultMarket:p.defaultMarket };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="travian-"+String(p.label||"profile").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".json"; a.click();
}
// One-click: export the profile currently selected in the header dropdown.
function exportActiveProfile(){ exportProfile(state); }
// Export with a chooser (defaults to the active profile) - handy to grab another profile.
function exportJSON(){
  let p = state;
  if(db.profiles.length>1){
    const list=db.profiles.map((x,i)=>(i+1)+") "+x.label).join("\n");
    const def=db.profiles.findIndex(x=>x.id===db.activeId)+1;
    const ans=window.prompt("Export which profile?\n\n"+list+"\n\nEnter number:",String(def));
    if(ans==null) return;
    const idx=parseInt(ans,10)-1; if(isNaN(idx)||!db.profiles[idx]){ alert("Invalid selection."); return; }
    p=db.profiles[idx];
  }
  exportProfile(p);
}
// Copy the retrieval script so it can be pasted into the game's console.
function pullFromGame(){
  const code=((document.getElementById('gamePullScript')||{}).textContent||'').trim();
  const steps="Pull live data from the game:\n\n"
    +"1) Open your Travian game world tab and log in.\n"
    +"2) Press F12, open the Console tab.\n"
    +"3) Paste (Ctrl+V) and press Enter.\n"
    +"4) It downloads travian-carrier-data.json.\n"
    +"5) Come back here and click Import / Sync, choose that file.";
  const ok=()=>alert("✓ Script copied to clipboard.\n\n"+steps);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(ok,()=>window.prompt(steps+"\n\nCopy the script below:",code));
  } else { window.prompt(steps+"\n\nCopy the script below:",code); }
}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(!d.villages){ alert("Unrecognized file."); return; }
    const key = d.accountKey || accountKeyOf(d.account);   // identify the account this file belongs to
    if(key){
      let p=db.profiles.find(x=>x.accountKey===key); const fresh=!p;
      if(fresh){ p=normalizeProfile({accountKey:key, label:d.label||(d.account&&d.account.player)||"Imported"}); db.profiles.push(p); }
      db.activeId=p.id; state=activeProfile();
      if(d.source==="travian-commander-profile"){       // full profile snapshot -> take it wholesale
        state.villages=d.villages||[]; state.routes=d.routes||[];
        if(d.serverSpeed!=null) state.serverSpeed=d.serverSpeed;
        if(d.allianceBonus!=null) state.allianceBonus=d.allianceBonus;
        if(d.defaultMarket!=null) state.defaultMarket=d.defaultMarket;
        ensureIds(state.villages); dedupeAndSort(state); save();
      } else {                                          // sync-style payload -> merge (and prune vanished)
        mergeSync(d.villages, true, true);
        if(Array.isArray(d.routes)) mergeSyncRoutes(d.routes); save();
      }
      renderAll();
      alert((fresh?'Created profile "':'Updated profile "')+p.label+'" — '+d.villages.length+" villages imported.");
      return;
    }
    // legacy file with no account info -> behave as before, into the active profile
    if(d.source==="travian-sync"){ mergeSync(d.villages); }
    else if(confirm("Import "+d.villages.length+' villages into "'+state.label+'".\n\nOK = MERGE (keeps routes & manual troops).\nCancel = REPLACE this profile\'s villages/routes.')){ mergeSync(d.villages); }
    else { state.villages=d.villages; state.routes=d.routes||[]; ensureIds(state.villages); dedupeAndSort(state); save(); renderAll(); }
  }catch(err){ alert("Invalid JSON."); } };
  rd.readAsText(f); e.target.value="";
}
function mergeSync(incoming, silent, prune){
  const key=v=>(v.x||0)+"|"+(v.y||0); // match by coordinates so in-game renames update in place
  let updated=0, added=0, removed=0;
  incoming.forEach(nv=>{
    const ex=state.villages.find(v=>key(v)===key(nv));
    if(ex){
      if(nv.name) ex.name=nv.name;   // adopt the current in-game name
      ex.prod=Object.assign({},ex.prod,nv.prod);
      if(nv.prodBoost) ex.prodBoost=nv.prodBoost;       // detected per-resource boost amount (/h)
      if(nv.prodBoostPct) ex.prodBoostPct=nv.prodBoostPct; // detected per-resource boost % (0/15/25)
      ex.warehouse=Object.assign({},ex.warehouse,nv.warehouse);
      ex.granary=Object.assign({},ex.granary,nv.granary);
      ex.tribe=nv.tribe||ex.tribe;
      if(nv.did) ex.did=nv.did;
      if(nv.baseConsumption!=null) ex.baseConsumption=nv.baseConsumption;
      if(nv.marketplaceLevel!=null) ex.marketplaceLevel=nv.marketplaceLevel;   // carrier count
      if(nv.tradeOfficeLevel!=null) ex.tradeOfficeLevel=nv.tradeOfficeLevel;
      if(nv.merchantCapacityReal!=null) ex.merchantCapacityReal=nv.merchantCapacityReal; // real per-merchant capacity
      if(nv.tradeShips!=null) ex.tradeShips=nv.tradeShips;
      if(nv.shipCapacityReal!=null) ex.shipCapacityReal=nv.shipCapacityReal; // real per-trade-ship cargo
      // barracks/stable levels come from game pull; troop config (troop type, priority) is user-set, never overwritten
      if(nv.barracksLevel!=null) ex.barracksLevel=nv.barracksLevel;
      if(nv.stableLevel!=null)   ex.stableLevel=nv.stableLevel;
      if(nv.workshopLevel!=null) ex.workshopLevel=nv.workshopLevel;
      if(nv.townHallLevel!=null) ex.townHallLevel=nv.townHallLevel; // for 24/7 celebration budgeting
      if(nv.trainable) ex.trainable=nv.trainable; // per-server unit cost + training time (from Barracks/Stable pages)
      if(nv.synced){ ex.synced=true; ex.troops=[]; }
      ex.updatedAt=nv.updatedAt||Date.now();
      updated++;
    } else {
      const t=TRIBES[nv.tribe]||TRIBES.Romans;
      state.villages.push({ id:uid(), name:nv.name||"Village", tribe:nv.tribe||"Romans",
        x:nv.x||0, y:nv.y||0, prod:nv.prod||{}, prodBoost:nv.prodBoost||null, prodBoostPct:nv.prodBoostPct||null, baseConsumption:nv.baseConsumption||0,
        troops:nv.troops||[], warehouse:nv.warehouse||{}, granary:nv.granary||{},
        merchantCapacity:nv.merchantCapacity||t.merchantCapacity,
        merchantSpeed:nv.merchantSpeed||t.merchantSpeed,
        tradeOfficeLevel:nv.tradeOfficeLevel||0, marketplaceLevel:nv.marketplaceLevel||0, did:nv.did||0,
        merchantCapacityReal:nv.merchantCapacityReal||0, tradeShips:nv.tradeShips||0,
        shipCapacityReal:nv.shipCapacityReal||0,
        troopVillage:false, troopPriority:1,
        barracksLevel:nv.barracksLevel||0, stableLevel:nv.stableLevel||0, workshopLevel:nv.workshopLevel||0, townHallLevel:nv.townHallLevel||0,
        barracksTroop:null, stableTroop:null, workshopTroop:null, trainable:nv.trainable||[], trainerArtifact:false, stillBuilding:false,
        synced:!!nv.synced, updatedAt:nv.updatedAt||Date.now() });
      added++;
    }
  });
  // On a full account pull, drop villages that were synced before but are gone now
  // (lost/conquered/destroyed). Manually-added villages (synced:false) are kept.
  if(prune){
    const keep=new Set(incoming.map(key));
    const gone=new Set(state.villages.filter(v=>v.synced && !keep.has(key(v))).map(v=>v.id));
    if(gone.size){
      state.villages=state.villages.filter(v=>!gone.has(v.id));
      state.routes=state.routes.filter(r=>!gone.has(r.from) && !gone.has(r.to));
      removed=gone.size;
    }
  }
  ensureIds(state.villages);
  dedupeAndSort(state); // collapse any rename-duplicates and re-order
  save(); renderAll();
  if(!silent) alert("Sync complete - "+updated+" updated, "+added+" added"+(removed?", "+removed+" removed":"")+".\nRoutes and manual troop data preserved.");
  return {updated, added, removed};
}
// Locate a village by its game id (did) or, failing that, its coordinates - the
// two stable keys the bridge can supply for a route's endpoints.
function findVilByGeo(did,x,y){
  return (did && state.villages.find(v=>v.did===did))
      || state.villages.find(v=>(v.x||0)===(x||0)&&(v.y||0)===(y||0))
      || null;
}
// Receive the recurring trade routes captured from the game marketplace and merge
// them onto the village graph. Endpoints arrive as did/coords and are mapped to the
// tool's internal ids. Routes flagged `synced` are owned by the bridge: each full
// push replaces them, so routes deleted in-game disappear here too, while manually
// added routes are left untouched. Multiple in-game sends to the same destination
// collapse into one route (flows add up; smallest interval wins).
function mergeSyncRoutes(incoming){
  incoming = incoming || [];
  const map={}, keep=new Set(); let skipped=0;
  incoming.forEach(nr=>{
    const from=findVilByGeo(nr.fromDid,nr.fromX,nr.fromY), to=findVilByGeo(nr.toDid,nr.toX,nr.toY);
    if(!from||!to||from.id===to.id){ skipped++; return; }
    const k=from.id+">"+to.id; keep.add(k);
    const iv=snapInterval(nr.intervalHours||24);
    const cur=map[k]||(map[k]={from:from.id,to:to.id,resources:{lumber:0,clay:0,iron:0,crop:0},intervalHours:iv,merchants:0});
    RES.forEach(r=>cur.resources[r]+=(nr.resources&&nr.resources[r])||0);
    cur.intervalHours=Math.min(cur.intervalHours,iv);
    cur.merchants+=(nr.merchants||0);
  });
  let added=0, updated=0;
  Object.keys(map).forEach(k=>{
    const m=map[k], ex=state.routes.find(r=>r.synced&&(r.from+">"+r.to)===k);
    if(ex){ ex.resources=m.resources; ex.intervalHours=m.intervalHours; ex.merchants=m.merchants||ex.merchants||1; ex.updatedAt=Date.now(); updated++; }
    else { state.routes.push({id:uid(),from:m.from,to:m.to,resources:m.resources,intervalHours:m.intervalHours,merchants:m.merchants||1,synced:true,updatedAt:Date.now()}); added++; }
  });
  // prune synced routes that no longer exist in-game (manual routes are preserved)
  const before=state.routes.length;
  state.routes=state.routes.filter(r=>!r.synced || keep.has(r.from+">"+r.to));
  const removed=before-state.routes.length;
  return {added,updated,removed,skipped};
}
// Entry point the Tampermonkey bridge calls to push live game data in silently.
// Accepts a JSON string or object; returns a short status string.
function applySyncedData(data){
  try{
    const d = (typeof data==="string") ? JSON.parse(data) : data;
    if(!d || !d.villages) return "no villages";
    // route this pull into the profile for its account (creating + switching to it if new)
    if(d.account){ const p=ensureProfileForAccount(d.account); if(p){ db.activeId=p.id; state=activeProfile(); } }
    if(d.account && d.account.server && !state.serverUrl){ state.serverUrl="https://"+d.account.server; detectServerSpeed(state.serverUrl); } // auto-fill so Send/+Route links work
    const r = mergeSync(d.villages, true, true); // full account pull -> prune villages that vanished
    let msg = (d.account? "["+state.label+"] " : "")+"synced "+d.villages.length+" villages ("+r.updated+" updated, "+r.added+" added"+(r.removed?", "+r.removed+" removed":"")+")";
    if(Array.isArray(d.routes)){
      const rr = mergeSyncRoutes(d.routes);
      msg += "; routes "+rr.added+" added, "+rr.updated+" updated"+(rr.removed?", "+rr.removed+" removed":"");
    }
    save(); renderAll();
    return msg;
  }catch(e){ console.warn("applySyncedData failed", e); return "error: "+e.message; }
}
window.applySyncedData = applySyncedData;

/* ---- paste-from-game parser (Warehouse stats page source) ---- */
function openPaste(){ document.getElementById("pasteBox").value=""; document.getElementById("pastePreview").innerHTML=""; document.getElementById("pImportBtn").disabled=true; pasteResults=[]; document.getElementById("pOverlay").classList.add("show"); }
function closePaste(){ document.getElementById("pOverlay").classList.remove("show"); }
function pStrip(s){ return String(s==null?"":s).replace(/[‪-‮⁦-⁩‎‏؜]/g,"").replace(/−/g,"-"); }
function pPair(td){ if(!td) return null; const t=pStrip(td.getAttribute("title")||""); const m=t.match(/(-?\d+)\s*\/\s*(-?\d+)/); return m?{cur:+m[1],cap:+m[2]}:null; }
function parseGamePaste(html){
  const res=[], coordMap={};
  const re=/"name":"((?:[^"\\]|\\.)*)","distance":[0-9.]+[\s\S]*?"x":(-?\d+),"y":(-?\d+)/g; let m;
  while((m=re.exec(html))){ coordMap[m[1].toLowerCase()]={x:+m[2],y:+m[3]}; }
  let doc; try{ doc=new DOMParser().parseFromString(html,"text/html"); }catch(e){ return res; }
  const table=doc.querySelector("#warehouse")||doc.querySelector("table");
  if(table){
    table.querySelectorAll("tbody tr").forEach(tr=>{
      const a=tr.querySelector("td.vil a")||tr.querySelector(".vil a"); if(!a) return;
      const name=pStrip(a.textContent).trim(); if(!name) return;
      const hm=(a.getAttribute("href")||"").match(/newdid=(\d+)/); const did=hm?+hm[1]:0;
      const lum=pPair(tr.querySelector("td.lum")), clay=pPair(tr.querySelector("td.clay")), iron=pPair(tr.querySelector("td.iron")), crop=pPair(tr.querySelector("td.crop"));
      const gran=tr.querySelector("td.max4"); const crit=!!(gran&&gran.querySelector(".crit"));
      const timer=gran?gran.querySelector(".timer"):null; const secs=timer?+timer.getAttribute("value"):0;
      let netCrop=0;
      if(crop&&secs>0){ netCrop = crit ? -(crop.cur/secs)*3600 : ((crop.cap-crop.cur)/secs)*3600; }
      const co=coordMap[name.toLowerCase()]||{x:0,y:0};
      res.push({ name, x:co.x, y:co.y, did,
        prod:{lumber:0,clay:0,iron:0,crop:Math.round(netCrop)}, baseConsumption:0,
        warehouse:{capacity:lum?lum.cap:0,lumber:lum?lum.cur:0,clay:clay?clay.cur:0,iron:iron?iron.cur:0},
        granary:{capacity:crop?crop.cap:0,crop:crop?crop.cur:0}, synced:true });
    });
  }
  const rm=html.match(/var\s+resources\s*=\s*\{[\s\S]*?\};/);
  if(rm){
    try{
      const pm=rm[0].match(/production:\s*(\{[^}]*\})/);
      const prod=pm?JSON.parse(pm[1]):null;
      const av=doc.querySelector(".villageInput");
      const an=pStrip(av?av.value:((doc.querySelector(".listEntry.active .name")||{}).textContent||"")).trim();
      const t=res.find(v=>v.name.toLowerCase()===an.toLowerCase());
      if(t&&prod){ t.prod.lumber=prod.l1; t.prod.clay=prod.l2; t.prod.iron=prod.l3; t.prod.crop=prod.l5; t.baseConsumption=Math.max(0,prod.l5-prod.l4); }
    }catch(e){}
  }
  return res;
}
function parsePastePreview(){
  const _raw=document.getElementById("pasteBox").value;
  const _t=(_raw.match(/<title>([^<]*)<\/title>/i)||[])[1]||"";
  const _sp=detectSpeed(_t)||detectSpeed(state.serverUrl); if(_sp){ state.serverSpeed=_sp; save(); }
  pasteResults=parseGamePaste(_raw);
  const pv=document.getElementById("pastePreview");
  if(!pasteResults.length){ pv.innerHTML='<span style="color:var(--bad)">No villages found. Paste the <b>Warehouse</b> stats page source (Ctrl+U).</span>'; document.getElementById("pImportBtn").disabled=true; return; }
  pv.innerHTML='<b style="color:var(--ok)">'+pasteResults.length+' villages found</b> &middot; server speed &times;'+(state.serverSpeed||1)+'<br>'+pasteResults.map(v=>{ const net=(v.prod.crop||0)-(v.baseConsumption||0); return esc(v.name)+" ("+v.x+"|"+v.y+") &mdash; net crop <span style=\"color:var(--"+(net>=0?'ok':'bad')+")\">"+signed(net)+"</span>/h, granary "+fmt(v.granary.crop)+"/"+fmt(v.granary.capacity); }).join("<br>");
  document.getElementById("pImportBtn").disabled=false;
}
function importPaste(){ if(!pasteResults.length) return; mergeSync(pasteResults); closePaste(); }

/* ---- shell ---- */
function setTab(t){
  tab=t;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  ["dash","optimizer","routes"].forEach(x=>document.getElementById("tab-"+x).style.display=x===t?"block":"none");
  renderAll();
}
function renderAll(){
  renderProfiles();
  renderCmd();
  if(tab==="dash") renderDash();
  else if(tab==="optimizer") renderOptimizer();
  else if(tab==="routes") renderRoutes();
}
loadOptSettings();
renderAll();
setInterval(renderAll,30000);
// Esc = cancel / go back: close the top-most open dialog (village / route / paste overlay).
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  const open=[...document.querySelectorAll(".overlay.show")].pop();
  if(open){ e.preventDefault(); open.classList.remove("show"); }
});
